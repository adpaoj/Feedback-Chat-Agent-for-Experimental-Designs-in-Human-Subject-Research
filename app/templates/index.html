<!DOCTYPE html>
<html>
<head>
    <title>Feedback AI</title>
</head>
<body>
    <h1>Feedback AI Agent</h1>
    <form method="POST">
        <input type="text" name="user_input" placeholder="Gib etwas ein">
        <button type="submit">Senden</button>
    </form>

    {% if output %}
    <h2>Output:</h2>
    <p>{{ output }}</p>
    {% endif %}
</body>
</html>
