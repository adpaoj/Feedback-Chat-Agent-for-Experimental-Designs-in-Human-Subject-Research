<!-- templates/index.html -->

{% extends "base.html" %}

{% block title %}EDAI - Home{% endblock %}

{% block content %}

<div class="row g-0 h-100 position-relative">
    <!-- Mobile Sidebar Toggle Button -->
    <button class="btn btn-primary d-md-none position-fixed top-0 start-0 m-2" style="z-index: 1050;" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
        <i class="bi bi-list"></i>
    </button>

    <!-- Desktop Sidebar (Static) -->
    <div class="col-md-3 col-lg-2 d-none d-md-flex flex-column bg-white border-end sidebar-container">
        <div class="p-3 flex-grow-1 overflow-auto border-bottom">
            <!-- Model Selector -->
            <div class="mb-3">
                <label for="model-select" class="form-label small fw-bold text-muted">Model</label>
                <select id="model-select" name="model" class="form-select form-select-sm"></select>
            </div>

            <!-- New Chat Button -->
            <div class="d-grid gap-2 mb-3">
                <button id="new-conversation" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-2"></i>New Chat
                </button>
            </div>
            
            <!-- Conversation History -->
            <h6 class="text-muted text-uppercase small fw-bold mb-3">History</h6>
            <div id="conversation-list" class="list-group list-group-flush">
                <!-- Conversations will be dynamically loaded here -->
            </div>
        </div>

        <!-- Settings Panel -->
        <div class="p-3 bg-light">
            <button class="btn btn-outline-secondary w-100 mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#settingsCollapse" aria-expanded="false" aria-controls="settingsCollapse">
                <i class="bi bi-gear me-2"></i>Settings
            </button>
            <div class="collapse" id="settingsCollapse">
                <div class="card card-body p-2">
                    <form id="settings-form">
                        <div class="mb-2">
                            <label for="temperature" class="form-label small">
                                Temperature <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip" title="Controls randomness (0.0 - 1.0)"></i>
                            </label>
                            <input type="number" step="0.1" min="0" max="1" id="temperature" name="temperature" class="form-control form-control-sm" value="0.5">
                        </div>
                        
                        <div class="mb-2">
                            <label for="max_tokens" class="form-label small">Max Tokens</label>
                            <input type="number" min="1" id="max_tokens" name="max_tokens" class="form-control form-control-sm" value="1500">
                        </div>
                        
                        <div class="mb-2">
                            <label for="system_prompt" class="form-label small">
                                System Instructions <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip" title="Define custom instructions for the AI (e.g., 'You are a Python expert')"></i>
                            </label>
                            <textarea id="system_prompt" name="system_prompt" class="form-control form-control-sm" rows="3" placeholder="You are a helpful assistant..."></textarea>
                        </div>
                        
                        <button type="button" id="save-settings" class="btn btn-sm btn-primary w-100">Save as Default</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Offcanvas Sidebar -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas" aria-labelledby="sidebarOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="sidebarOffcanvasLabel"><i class="bi bi-chat-dots-fill me-2"></i>EDAI</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-0">
            <div class="p-3 flex-grow-1 overflow-auto border-bottom">
                <!-- Model Selector (Mobile) -->
                <div class="mb-3">
                    <label for="model-select-mobile" class="form-label small fw-bold text-muted">Model</label>
                    <select id="model-select-mobile" name="model" class="form-select form-select-sm"></select>
                </div>

                <!-- New Chat Button (Mobile) -->
                <div class="d-grid gap-2 mb-3">
                    <button id="new-conversation-mobile" class="btn btn-primary" data-bs-dismiss="offcanvas">
                        <i class="bi bi-plus-lg me-2"></i>New Chat
                    </button>
                </div>
                
                <!-- Conversation History (Mobile) -->
                <h6 class="text-muted text-uppercase small fw-bold mb-3">History</h6>
                <div id="conversation-list-mobile" class="list-group list-group-flush">
                    <!-- Conversations will be dynamically loaded here -->
                </div>
            </div>

            <!-- Settings Panel (Mobile) -->
            <div class="p-3 bg-light">
                <button class="btn btn-outline-secondary w-100 mb-2" type="button" data-bs-toggle="collapse" data-bs-target="#settingsCollapseMobile" aria-expanded="false" aria-controls="settingsCollapseMobile">
                    <i class="bi bi-gear me-2"></i>Settings
                </button>
                <div class="collapse" id="settingsCollapseMobile">
                    <div class="card card-body p-2">
                        <form id="settings-form-mobile">
                            <div class="mb-2">
                                <label for="temperature-mobile" class="form-label small">
                                    Temperature <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip" title="Controls randomness (0.0 - 1.0)"></i>
                                </label>
                                <input type="number" step="0.1" min="0" max="1" id="temperature-mobile" name="temperature" class="form-control form-control-sm" value="0.5">
                            </div>
                            
                            <div class="mb-2">
                                <label for="max_tokens-mobile" class="form-label small">Max Tokens</label>
                                <input type="number" min="1" id="max_tokens-mobile" name="max_tokens" class="form-control form-control-sm" value="1500">
                            </div>
                            
                            <div class="mb-2">
                                <label for="system_prompt-mobile" class="form-label small">
                                    System Instructions <i class="bi bi-info-circle text-muted" data-bs-toggle="tooltip" title="Define custom instructions for the AI"></i>
                                </label>
                                <textarea id="system_prompt-mobile" name="system_prompt" class="form-control form-control-sm" rows="3" placeholder="You are a helpful assistant..."></textarea>
                            </div>
                            
                            <button type="button" id="save-settings-mobile" class="btn btn-sm btn-primary w-100">Save as Default</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="col-md-9 col-lg-10 d-flex flex-column chat-container">
        <!-- Chat Messages Window -->
        <div id="chat-window" class="flex-grow-1 p-4 overflow-auto bg-light">
            <div class="text-center text-muted mt-5">
                <i class="bi bi-chat-square-text display-1"></i>
                <p class="mt-3 lead">Write "Evaluate: [copy your experiment design]" to get started. Then you can ask specific questions.</p>
            </div>
        </div>
        
        <!-- Message Input Area -->
        <div class="p-3 bg-white border-top">
            <form id="chat-form">
                <!-- File Preview -->
                <div id="file-preview-container" class="mb-2" style="display: none;">
                    <div class="position-relative d-inline-block p-2 border rounded bg-white">
                        <span id="file-name" class="me-2"></span>
                        <button type="button" class="btn-close btn-sm" id="remove-file" aria-label="Close"></button>
                    </div>
                </div>
                
                <!-- Input Group -->
                <div class="input-group">
                    <button type="button" class="btn btn-outline-secondary" id="upload-btn" title="Upload File">
                        <i class="bi bi-paperclip"></i>
                    </button>
                    <input type="file" id="file-upload" class="d-none" accept="image/*,.txt,.md,.py,.js,.json,.csv,.html,.css">
                    
                    <textarea id="message-input" class="form-control" placeholder="Type your message here..." rows="1" style="resize: none; overflow-y: hidden;"></textarea>
                    
                    <button type="submit" id="send-button" class="btn btn-primary">
                        <i class="bi bi-send-fill"></i>
                    </button>
                    <button type="button" id="stop-button" class="btn btn-danger" style="display: none;">
                        <i class="bi bi-stop-fill"></i>
                    </button>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <small class="text-muted">Shift + Enter for new line</small>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    /* Full height layout */
    body { 
        height: 100vh; 
        overflow: hidden; 
    }
    main { 
        padding: 0; 
        overflow: hidden;
    }
    main .container-fluid { 
        padding: 0; 
        height: 100%;
    }
    
    /* Sidebar and chat container heights */
    .sidebar-container {
        height: 100%;
    }
    .chat-container {
        height: 100%;
    }
    
    /* Chat window scrolling */
    #chat-window {
        scroll-behavior: smooth;
    }

    /* Chat message bubbles */
    .chat-message {
        display: flex;
        flex-direction: column;
        margin-bottom: 1.5rem;
        position: relative;
    }
    
    .chat-message.user {
        align-items: flex-end;
    }
    
    .chat-message.assistant {
        align-items: flex-start;
    }
    
    .message-content {
        padding: 1rem;
        border-radius: 1rem;
        max-width: 80%;
        word-wrap: break-word;
    }
    
    .chat-message.user .message-content {
        background-color: #ffffff;
        color: #212529;
        border: 2px solid #009682;
        border-bottom-right-radius: 0.25rem;
    }
    
    .chat-message.assistant .message-content {
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        color: #212529;
        border-bottom-left-radius: 0.25rem;
    }
    
    /* Message action buttons */
    .message-actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        font-size: 0.875rem;
    }
    
    .message-actions button {
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        border: none;
        background: none;
        cursor: pointer;
        color: #6c757d;
    }
    
    .message-actions button:hover {
        color: #0d6efd;
    }
    
    /* Markdown content styling */
    .chat-message pre {
        background-color: rgba(0,0,0,0.05);
        padding: 0.75rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin: 0.5rem 0;
    }
    
    .chat-message.user pre {
        background-color: rgba(0,0,0,0.05);
    }
    
    .chat-message p {
        margin-bottom: 0.5rem;
    }
    
    .chat-message p:last-child {
        margin-bottom: 0;
    }
    
    .chat-message code {
        background-color: rgba(0,0,0,0.1);
        padding: 0.2em 0.4em;
        border-radius: 3px;
        font-size: 0.9em;
    }
    
    .chat-message.user code {
        background-color: rgba(0,0,0,0.05);
        color: inherit;
    }
    
    .chat-message pre code {
        background-color: transparent;
        padding: 0;
    }
    
    /* Hover effect for conversation list items */
    .list-group-item:hover {
        cursor: pointer;
        background-color: #f8f9fa;
    }
    
    /* Delete button styling */
    .delete-btn {
        opacity: 0;
        transition: opacity 0.2s;
    }
    
    .list-group-item:hover .delete-btn {
        opacity: 1;
    }
    
    /* Mobile improvements */
    @media (max-width: 767.98px) {
        .message-content {
            max-width: 90%;
        }
    }
</style>

<script>
    // Initialize Bootstrap tooltips
    document.addEventListener('DOMContentLoaded', function () {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    });
</script>

{% endblock %}
